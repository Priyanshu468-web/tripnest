# TripNest Application Configuration (Default: Development with H2)
spring.application.name=tripnest-backend
server.port=8080

# Database Configuration (H2 File / In-Memory with MySQL compatibility)
spring.datasource.url=jdbc:h2:file:./data/tripnestdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL;NON_KEYWORDS=USER,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 Console for Inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=./uploads

# JWT Security Configuration
app.jwt.secret=9a6747f3a18e00d92e884e4935728f2e6315747b887e323a0e161b9a0c16b7202d81cf8b02e7970f609b664f9746b140
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# Mail Configuration (Fallback/Development default)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notifications@tripnest.com
spring.mail.password=dummy_mail_password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false

# Weather & Maps API Keys (Mock fallback enabled when blank)
app.openweather.api-key=
app.googlemaps.api-key=
